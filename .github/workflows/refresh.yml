name: Refresh sales tables

# 23:38 UTC = 06:38 WIB. Runs in GitHub's cloud, so it does not depend on
# anyone's laptop being awake.
#
# Deliberately NOT on the hour: GitHub queues every repository's cron together and
# drops or badly delays runs at popular times. "0 0 * * *" was skipped entirely on
# 2026-09-10 — zero scheduled runs fired. An odd minute, offset earlier so a delay
# still lands before 07:00 WIB, is the documented workaround.
on:
  schedule:
    - cron: "38 23 * * *"
  workflow_dispatch:        # lets you trigger a refresh by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-sales-tables
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # cs.html alone took 19 min locally (~450 Kommo calls, events endpoint is slow)
    timeout-minutes: 60
    steps:
      # full history: the commit step rebuilds on top of whatever main looks like after
      # the build, and pushing from a shallow clone can be rejected
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sales.html from Kommo
        env:
          KOMMO_TOKEN: ${{ secrets.KOMMO_TOKEN }}
          SALES_OUT: sales.html
        run: |
          if [ -z "$KOMMO_TOKEN" ]; then
            echo "::error::KOMMO_TOKEN secret is not set (Settings -> Secrets and variables -> Actions)"
            exit 1
          fi
          python3 kommo_sales_tables.py --no-git

      - name: Build cs.html (CS Quality) from Kommo
        env:
          KOMMO_TOKEN: ${{ secrets.KOMMO_TOKEN }}
          CS_OUT: cs.html
        run: python3 kommo_cs_quality.py --no-git

      - name: Commit and push if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The build takes minutes, and Nina's Mac pushes sales.html/index.html from its
          # launchd jobs whenever it wakes up — run #36 (16 Sep) was rejected that way.
          # So commit onto whatever main is NOW: reset --mixed keeps the freshly generated
          # files in the working tree while moving HEAD to the latest remote commit, and
          # only these two generated files are ever staged, so a concurrent push of
          # index.html (or anything else) survives untouched.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --mixed FETCH_HEAD
            git add sales.html cs.html
            if git diff --cached --quiet; then
              echo "sales.html and cs.html unchanged — nothing to commit"
              exit 0
            fi
            git commit -m "sales tables $(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M') WIB"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "::warning::push rejected (someone else pushed first) — retry $attempt/3"
            sleep 5
          done
          echo "::error::could not push after 3 attempts"
          exit 1
